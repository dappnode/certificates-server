name: Deploy

on:
  push:
    branches: [master]

jobs:
  push-to-ghcr:
    runs-on: ubuntu-latest
    # Grant packages: write at the job level so the GITHUB_TOKEN can push
    # to ghcr.io even if a repo/org default sets the token to read-only.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/dappnode/certificates-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Tell the watchtower instance with the cert-api to pull its image
      - name: Trigger cert-api webhook
        run: |
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${{ secrets.DDNS_SERVER_PUSH_TOKEN }}" \
            "${{ secrets.DDNS_SERVER_PUSH_URL }}"
