name: Deploy

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  push-to-ghcr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/dappnode/certificates-server:latest
      # Tell the watchtower instance with the cert-api to pull its image
      - name: Trigger cert-api webhook
        run: |
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${{ secrets.DDNS_SERVER_PUSH_TOKEN }}" \
            "${{ secrets.DDNS_SERVER_PUSH_URL }}"
